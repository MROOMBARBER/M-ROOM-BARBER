<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Meta tags pour le partage -->
    <title>M ROOM BARBER</title>
    <meta name="description" content="M ROOM BARBER - Barbier & Coiffeur Professionnel">
    
    <!-- Open Graph (WhatsApp/Instagram Preview) -->
    <meta property="og:title" content="M ROOM BARBER">
    <meta property="og:description" content="L'excellence du barbier traditionnel.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="logo.png">

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --whatsapp-color: #25D366;
            --maps-color: #4285F4;
            --instagram-color: #E1306C;
            --tiktok-color: #00f2ea;
            --wifi-color: #ffffff;
            --google-red: #EA4335; 
            --pure-black: #000000;
            --gold: #c5a059;
            --gold-light: #e2c285;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Playfair Display', 'Times New Roman', serif;
        }

        body {
            /* Image de fond */
            background-image: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), url('https://i.postimg.cc/Xq4vMtJp/unnamed.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: white;
        }

        .container {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 0, 0, 1);
            text-align: center;
            border: 1px solid rgba(197, 160, 89, 0.4);
            animation: fadeIn 1s ease-in;
            position: relative;
            margin: 20px 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .header {
            padding: 40px 20px 20px;
            position: relative;
        }

        .header::after {
            content: '';
            display: block;
            width: 60%;
            height: 1px;
            background: var(--gold);
            margin: 20px auto 0;
            opacity: 0.6;
        }

        .logo-img {
            width: 160px;
            height: auto;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 8px rgba(197, 160, 89, 0.5));
        }

        p.subtitle {
            font-size: 13px;
            color: var(--gold);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 10px;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 300;
        }

        .welcome-msg {
            font-size: 18px;
            color: var(--gold);
            margin-top: 15px;
            font-weight: bold;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            letter-spacing: 1px;
        }

        .links-container {
            padding: 20px 25px;
        }

        .btn {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-family: 'Segoe UI', sans-serif;
            border: 1px solid transparent;
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn i {
            font-size: 18px;
            margin-right: 15px;
            width: 25px;
            text-align: center;
        }

        .whatsapp { border-color: var(--whatsapp-color); color: var(--whatsapp-color); }
        .instagram { border-color: var(--instagram-color); color: var(--instagram-color); }
        .tiktok { border-color: var(--tiktok-color); color: var(--tiktok-color); }
        .maps { border-color: var(--maps-color); color: var(--maps-color); }
        .review { border-color: var(--gold); color: var(--gold); }
        .wifi { border-color: var(--wifi-color); color: var(--wifi-color); }

        /* Styles de la Galerie (Carousel) */
        .gallery-wrapper {
            padding: 10px 0 25px;
            margin-top: 10px;
        }
        
        .gallery-title {
            color: var(--gold);
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'Segoe UI', sans-serif;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .gallery-title::before, .gallery-title::after {
            content: '';
            width: 30px;
            height: 1px;
            background: var(--gold);
            opacity: 0.4;
        }

        .gallery-scroll {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            gap: 15px;
            padding: 0 35px 15px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .gallery-scroll::-webkit-scrollbar {
            display: none;
        }

        .gallery-item {
            flex: 0 0 85%;
            scroll-snap-align: center;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(197, 160, 89, 0.4);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            aspect-ratio: 1/1;
            cursor: pointer;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Modaux */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        .modal-content {
            background: #111;
            padding: 25px;
            border-radius: 20px;
            border: 1px solid var(--gold);
            text-align: center;
            max-width: 320px;
            width: 100%;
            position: relative;
        }

        .wifi-qr-only {
            width: 100%;
            height: auto;
            border-radius: 10px;
            margin: 10px 0 20px;
            border: 1px solid rgba(197, 160, 89, 0.5);
        }

        /* Plein Écran Slider Animation */
        #fullImageModal .modal-content {
            background: transparent;
            border: none;
            max-width: 95%;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #fullImageDisplay {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 10px;
            border: 1px solid var(--gold);
            box-shadow: 0 0 30px rgba(197, 160, 89, 0.4);
            user-select: none;
            transition: transform 0.3s ease-out, opacity 0.3s ease-out;
        }

        .img-fade-in {
            animation: imgFadeScale 0.4s ease-out forwards;
        }

        @keyframes imgFadeScale {
            from {
                opacity: 0.4;
                transform: scale(0.92);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold);
            font-size: 24px;
            background: rgba(0,0,0,0.6);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            border: 1px solid rgba(197, 160, 89, 0.3);
            transition: background 0.2s;
        }

        .prev-arrow { left: -5px; }
        .next-arrow { right: -5px; }

        .close-modal {
            margin-top: 15px;
            color: var(--gold);
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 14px;
            border-bottom: 1px solid var(--gold);
            display: inline-block;
            padding-bottom: 2px;
        }

        .footer {
            padding: 20px;
            font-size: 11px;
            color: #666;
            background: rgba(0, 0, 0, 0.5);
            letter-spacing: 1px;
            font-family: 'Segoe UI', sans-serif;
            border-top: 1px solid rgba(197, 160, 89, 0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="logo.png" alt="M ROOM BARBER LOGO" class="logo-img" onerror="this.style.display='none'; document.getElementById('alt-logo').style.display='block';">
        <div id="alt-logo" style="display:none; font-size: 40px; color: var(--gold); margin-bottom: 15px;">
            <i class="fas fa-cut"></i>
            <h2 style="font-size: 24px;">M ROOM</h2>
        </div>
        <p class="subtitle">Barbershop</p>
        <div class="welcome-msg">مرحبا بكم عندنا</div>
    </div>

    <div class="links-container">
        <!-- WhatsApp -->
        <a href="https://wa.me/212629006432" target="_blank" class="btn whatsapp">
            <i class="fab fa-whatsapp"></i> WHATSAPP
        </a>

        <!-- Instagram -->
        <a href="https://www.instagram.com/THEMROOMOFFICIEL_" target="_blank" class="btn instagram">
            <i class="fab fa-instagram"></i> INSTAGRAM
        </a>

        <!-- TikTok -->
        <a href="https://www.tiktok.com/@goldenbarberr?_r=1&_t=ZS-94gppenfMqG" target="_blank" class="btn tiktok">
            <i class="fab fa-tiktok"></i> TIKTOK
        </a>

        <!-- WiFi Button -->
        <div onclick="openWifiModal()" class="btn wifi">
            <i class="fas fa-wifi"></i> WIFI FREE
        </div>

        <!-- Google Maps -->
        <a href="https://www.google.com/maps/place/The+M+Room+Barber/@33.5677466,-7.6537347,17z/data=!3m1!4b1!4m6!3m5!1s0xda7d30e1a6200cd:0x459d3f176cb65559!8m2!3d33.5677466!4d-7.6511598!16s%2Fg%2F11yl1383c3?entry=ttu" target="_blank" class="btn maps">
            <i class="fas fa-map-marker-alt"></i> GOOGLE MAPS
        </a>

        <!-- Google Review -->
        <a href="https://www.google.com/search?q=The+M+Room+Barber+Avis&si=AL3DRZEsmMGCryMMFSHJ3StBhOdZ2-6yYkXd_doETEE1OR-qOcvVMCu0vbex3UK9zwa09BwsJHkHaEzqAOcP9eHUtX8wL-v74MfjZCh410JYDXpGin1k5xiUvgionGwtQ6EGcgcdFRTH" target="_blank" class="btn review">
            <i class="fab fa-google"></i> AVIS GOOGLE
        </a>
    </div>

    <!-- Section Galerie -->
    <div class="gallery-wrapper">
        <div class="gallery-title">Notre Galerie</div>
        <div class="gallery-scroll" id="gallery-scroll">
            <!-- Images générées par JS -->
        </div>
        <div style="font-size: 10px; color: var(--gold); opacity: 0.6; margin-top: -5px; display: flex; justify-content: center; align-items: center; gap: 10px;">
            <i class="fas fa-chevron-left"></i> SWIPE <i class="fas fa-chevron-right"></i>
        </div>
    </div>

    <div class="footer">
        &copy; 2026 M ROOM BARBER | ALL RIGHTS RESERVED
    </div>
</div>

<!-- Modal WiFi -->
<div id="wifiModal" class="modal">
    <div class="modal-content">
        <h3 style="color:var(--gold); margin-bottom: 15px; text-transform: uppercase; font-size: 16px;">M ROOM WIFI ACCESS</h3>
        
        <!-- Only the QR Code Image sent by the user -->
        <img src="https://i.postimg.cc/63L9hzhS/photo-5857188129129827783-y.jpg" class="wifi-qr-only" alt="WiFi QR Code">
        
        <p style="font-size: 13px; opacity: 0.8; margin-bottom: 15px;">Scannez pour vous connecter rapidement.</p>
        
        <div class="close-modal" onclick="closeModal('wifiModal')">Fermer</div>
    </div>
</div>

<!-- Modal Image Plein Écran -->
<div id="fullImageModal" class="modal">
    <div class="modal-content" id="swipe-container">
        <div class="nav-arrow prev-arrow" onclick="changeImage(-1)"><i class="fas fa-chevron-left"></i></div>
        <img id="fullImageDisplay" src="" alt="Vue agrandie">
        <div class="nav-arrow next-arrow" onclick="changeImage(1)"><i class="fas fa-chevron-right"></i></div>
    </div>
    <div class="close-modal" onclick="closeModal('fullImageModal')">Fermer</div>
</div>

<script>
    const images = [
        "https://i.postimg.cc/s23HjV3n/photo-5884097001182399663-y.jpg",
        "https://i.postimg.cc/1zMC4Lzp/photo-5884097001182399664-y.jpg",
        "https://i.postimg.cc/hGMyhHGL/photo-5884097001182399665-w.jpg",
        "https://i.postimg.cc/hGMyhHG8/photo-5884097001182399666-w.jpg",
        "https://i.postimg.cc/0N9Xk89X/photo-5884097001182399667-y.jpg"
    ];
    let currentIndex = 0;

    const scrollContainer = document.getElementById('gallery-scroll');
    images.forEach((src, index) => {
        const item = document.createElement('div');
        item.className = 'gallery-item';
        item.onclick = () => openImageModal(index);
        item.innerHTML = `<img src="${src}" alt="Coupe ${index + 1}">`;
        scrollContainer.appendChild(item);
    });

    function openWifiModal() {
        document.getElementById('wifiModal').style.display = 'flex';
    }

    function openImageModal(index) {
        currentIndex = index;
        updateModalImage();
        document.getElementById('fullImageModal').style.display = 'flex';
    }

    function updateModalImage() {
        const display = document.getElementById('fullImageDisplay');
        display.classList.remove('img-fade-in');
        display.src = images[currentIndex];
        void display.offsetWidth;
        display.classList.add('img-fade-in');
    }

    function changeImage(step) {
        currentIndex += step;
        if (currentIndex < 0) currentIndex = images.length - 1;
        if (currentIndex >= images.length) currentIndex = 0;
        updateModalImage();
    }

    function closeModal(modalId) {
        document.getElementById(modalId).style.display = 'none';
    }

    // Keyboard navigation (PC)
    document.addEventListener('keydown', e => {
        const modal = document.getElementById('fullImageModal');
        if (modal.style.display === 'flex') {
            if (e.key === 'ArrowRight') changeImage(1);
            if (e.key === 'ArrowLeft') changeImage(-1);
            if (e.key === 'Escape') closeModal('fullImageModal');
        }
    });

    // Touch Swipe Logic
    let touchstartX = 0;
    let touchendX = 0;
    const swipeContainer = document.getElementById('swipe-container');

    swipeContainer.addEventListener('touchstart', e => {
        touchstartX = e.changedTouches[0].screenX;
    }, {passive: true});

    swipeContainer.addEventListener('touchend', e => {
        touchendX = e.changedTouches[0].screenX;
        handleSwipe();
    }, {passive: true});

    function handleSwipe() {
        const diff = touchstartX - touchendX;
        if (Math.abs(diff) > 50) {
            if (diff > 0) changeImage(1);
            else changeImage(-1);
        }
    }

    window.onclick = function(event) {
        if (event.target.classList.contains('modal')) {
            event.target.style.display = "none";
        }
    }
</script>

</body>
</html>
